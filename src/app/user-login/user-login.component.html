<form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate class="login-form">
  <div class="input-group">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="credentials.email"
      #email="ngModel"
      required
    />
    <div class="error" *ngIf="email.invalid && email.touched">
      Email is required and must be valid.
    </div>
  </div>

  <div class="input-group">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="credentials.password"
      #password="ngModel"
      required
      minlength="3"
    />
    <div class="error" *ngIf="password.invalid && password.touched">
      Password is required and must be at least 3 characters.
    </div>
  </div>

  <div class="input-group">
    <label for="role">Role</label>
    <select
      id="role"
      name="role"
      [(ngModel)]="credentials.role"
      #role="ngModel"
      required
    >
      <option value="" disabled>Select Role</option>
      <option value="ROLE_USER">User</option>
      <option value="ROLE_ADMIN">Admin</option>
    </select>
    <div class="error" *ngIf="role.invalid && role.touched">
      Role is required.
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid">Login</button>
</form>
